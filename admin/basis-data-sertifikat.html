<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basis Data Sertifikat — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css?v=5">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="admin" data-active="basis-data-sertifikat" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div><h1 class="text-xl font-extrabold text-slate-800">Basis Data Sertifikat</h1><p class="text-sm text-slate-400 mt-0.5">Seluruh data sertifikat lengkap untuk keperluan verifikasi &amp; audit.</p></div>
      <button id="btn-csv" class="text-sm font-bold border border-slate-200 px-4 py-2.5 rounded-lg hover:bg-slate-50">Unduh CSV</button>
    </div>
    <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-lg px-3 py-2 max-w-sm mb-5 text-slate-400">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-4 h-4"><circle cx="10.5" cy="10.5" r="6"/><path d="m20 20-4.3-4.3" stroke-linecap="round"/></svg>
      <input id="cari" type="text" placeholder="Cari nomor sertifikat / nama peserta..." class="text-sm outline-none w-full text-slate-600">
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full table-clean min-w-[1200px]">
        <thead><tr><th>ID</th><th>Nomor Sertifikat</th><th>Peserta</th><th>Pelatihan</th><th>Trainer</th><th>Terbit</th><th>Berlaku Hingga</th><th>Status</th><th>URL Verifikasi</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../assets/js/data.js?v=5"></script>
<script src="../assets/js/store.js?v=5"></script>
<script src="../assets/js/ui.js?v=5"></script>
<script src="../assets/js/layout.js?v=5"></script>
<script src="../assets/js/certificate.js?v=5"></script>
<script>
  var session = Store.getSession();
  if (session && session.role === 'admin') {
    var kataKunci = '';

    function render() {
      var list = Store.getSertifikat().filter(function(c){
        var lengkap = Certificate.lengkapi(c);
        var teks = (c.nomor + ' ' + (lengkap.peserta ? lengkap.peserta.nama : '')).toLowerCase();
        return teks.indexOf(kataKunci.toLowerCase()) !== -1;
      });
      document.getElementById('tbody').innerHTML = list.length ? list.map(function(c){
        var lengkap = Certificate.lengkapi(c);
        var kelas = Store.kelasBySkemaId(c.skemaId);
        var trainer = kelas ? Store.instrukturById(kelas.instrukturId) : null;
        var url = Certificate.urlValidasi(c.nomor);
        return '<tr>' +
          '<td class="font-mono text-xs text-slate-400">' + c.id + '</td>' +
          '<td class="font-mono text-xs font-semibold">' + c.nomor + '</td>' +
          '<td>' + (lengkap.peserta ? lengkap.peserta.nama : '-') + '</td>' +
          '<td>' + (lengkap.pelatihan ? lengkap.pelatihan.nama : '-') + '</td>' +
          '<td>' + (trainer ? trainer.nama : '-') + '</td>' +
          '<td>' + UI.formatTanggalSingkat(c.tanggalTerbit) + '</td>' +
          '<td>' + UI.formatTanggalSingkat(c.berlakuHingga) + '</td>' +
          '<td>' + UI.badgeSertifikat(lengkap.statusEfektif) + '</td>' +
          '<td><a href="' + url + '" target="_blank" class="text-xs text-brand-700 font-semibold hover:underline">Buka &rarr;</a></td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="9" class="text-center text-slate-400 py-8">Tidak ada data yang cocok.</td></tr>';
    }

    document.getElementById('cari').addEventListener('input', function(e){ kataKunci = e.target.value; render(); });

    document.getElementById('btn-csv').addEventListener('click', function(){
      var rows = [['ID','Nomor Sertifikat','Peserta','Pelatihan','Trainer','Tanggal Terbit','Berlaku Hingga','Status','URL Verifikasi']];
      Store.getSertifikat().forEach(function(c){
        var lengkap = Certificate.lengkapi(c);
        var kelas = Store.kelasBySkemaId(c.skemaId);
        var trainer = kelas ? Store.instrukturById(kelas.instrukturId) : null;
        rows.push([c.id, c.nomor, lengkap.peserta ? lengkap.peserta.nama : '-', lengkap.pelatihan ? lengkap.pelatihan.nama : '-', trainer ? trainer.nama : '-', c.tanggalTerbit, c.berlakuHingga, lengkap.statusEfektif, Certificate.urlValidasi(c.nomor)]);
      });
      var csv = rows.map(function(row){ return row.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'basis-data-sertifikat.csv';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    });

    render();
  }
</script>
</body>
</html>
