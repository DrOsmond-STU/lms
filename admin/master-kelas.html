<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Kelas — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css?v=5">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="admin" data-active="master-kelas" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div><h1 class="text-xl font-extrabold text-slate-800">Master Kelas</h1><p class="text-sm text-slate-400 mt-0.5">Kelola kelas/batch untuk setiap pelatihan beserta instrukturnya.</p></div>
      <button id="btn-tambah" class="text-sm font-bold text-white px-4 py-2.5 rounded-lg" style="background:var(--brand-800)">+ Tambah Kelas</button>
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full table-clean min-w-[820px]">
        <thead><tr><th>Pelatihan</th><th>Trainer</th><th>Batch</th><th>Kuota</th><th>Peserta</th><th>Aksi</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<div id="modal" class="fixed inset-0 z-[70] hidden items-center justify-center p-4 bg-slate-900/50">
  <div class="bg-white rounded-2xl w-full max-w-md p-6">
    <div class="flex items-center justify-between mb-4"><h3 class="font-bold text-slate-800">Tambah Kelas</h3><button id="modal-close" class="text-slate-400"></button></div>
    <form id="form" class="space-y-4">
      <div><label class="text-xs font-bold text-slate-500 mb-1 block">Pelatihan</label><select id="f-pelatihan" required class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm"></select></div>
      <div><label class="text-xs font-bold text-slate-500 mb-1 block">Trainer Pengampu</label><select id="f-trainer" required class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm"></select></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs font-bold text-slate-500 mb-1 block">Nama Batch</label><input id="f-batch" required placeholder="Batch Ganjil 2026" class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm"></div>
        <div><label class="text-xs font-bold text-slate-500 mb-1 block">Kuota</label><input id="f-kuota" type="number" min="1" value="30" required class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm"></div>
      </div>
      <button type="submit" class="w-full font-bold text-white py-2.5 rounded-lg" style="background:var(--brand-800)">Simpan Kelas</button>
    </form>
  </div>
</div>

<script src="../assets/js/data.js?v=5"></script>
<script src="../assets/js/store.js?v=5"></script>
<script src="../assets/js/ui.js?v=5"></script>
<script src="../assets/js/layout.js?v=5"></script>
<script>
  var session = Store.getSession();
  if (session && session.role === 'admin') {

    function render() {
      var list = Store.getKelas();
      document.getElementById('tbody').innerHTML = list.length ? list.map(function(k){
        var s = Store.skemaById(k.skemaId);
        var ins = Store.instrukturById(k.instrukturId);
        var peserta = Store.pendaftaranByKelas(k.skemaId).length;
        return '<tr>' +
          '<td class="font-semibold">' + (s ? s.nama : '-') + (s ? '<br>' + UI.kategoriTag(s.kategori) : '') + '</td>' +
          '<td>' + (ins ? ins.nama : '-') + '</td>' +
          '<td>' + k.batch + '</td>' +
          '<td>' + peserta + ' / ' + k.kuota + '</td>' +
          '<td>' + peserta + '</td>' +
          '<td><button data-id="' + k.id + '" class="btn-hapus text-xs font-bold text-rose-600 hover:underline">Hapus</button></td>' +
        '</tr>';
      }).join('') : '<tr><td colspan="6" class="text-center text-slate-400 py-8">Belum ada kelas.</td></tr>';

      document.querySelectorAll('.btn-hapus').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (!confirm('Hapus kelas ini?')) return;
          Store.hapus(btn.dataset.id);
          UI.toast('Kelas dihapus', 'peringatan');
          render();
        });
      });
    }

    document.getElementById('f-pelatihan').innerHTML = Store.getSkema().map(function(s){ return '<option value="' + s.id + '">' + s.nama + '</option>'; }).join('');
    document.getElementById('f-trainer').innerHTML = Store.getInstruktur().map(function(i){ return '<option value="' + i.id + '">' + i.nama + '</option>'; }).join('');

    function toggleModal(show) {
      document.getElementById('modal').classList.toggle('hidden', !show);
      document.getElementById('modal').classList.toggle('flex', show);
    }
    document.getElementById('modal-close').innerHTML = UI.Icon.x;
    document.getElementById('btn-tambah').addEventListener('click', function(){ toggleModal(true); });
    document.getElementById('modal-close').addEventListener('click', function(){ toggleModal(false); });

    document.getElementById('form').addEventListener('submit', function(e){
      e.preventDefault();
      Store.tambahKelas({
        skemaId: document.getElementById('f-pelatihan').value,
        instrukturId: document.getElementById('f-trainer').value,
        batch: document.getElementById('f-batch').value,
        kuota: parseInt(document.getElementById('f-kuota').value, 10),
        kuis: []
      });
      document.getElementById('form').reset();
      toggleModal(false);
      UI.toast('Kelas berhasil ditambahkan', 'sukses');
      render();
    });

    render();
  }
</script>
</body>
</html>
