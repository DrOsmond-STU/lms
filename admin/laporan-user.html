<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Pengguna per Organisasi — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css?v=2">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="admin" data-active="laporan-user" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div><h1 class="text-xl font-extrabold text-slate-800">Laporan Pengguna per Organisasi</h1><p class="text-sm text-slate-400 mt-0.5">Rekap jumlah peserta &amp; trainer pada setiap organisasi mitra.</p></div>
      <button id="btn-csv" class="text-sm font-bold border border-slate-200 px-4 py-2.5 rounded-lg hover:bg-slate-50 flex items-center gap-1.5">Unduh CSV</button>
    </div>

    <div class="card p-5 mb-6"><p class="font-bold text-slate-800 mb-4">Perbandingan Jumlah Pengguna</p><div class="h-72"><canvas id="chart-user"></canvas></div></div>

    <div class="card overflow-x-auto">
      <table class="w-full table-clean min-w-[820px]">
        <thead><tr><th>Organisasi</th><th>Peserta</th><th>Trainer</th><th>Pendaftaran Sertifikasi</th><th>Lulus</th><th>Tingkat Kelulusan</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../assets/js/data.js?v=2"></script>
<script src="../assets/js/store.js?v=2"></script>
<script src="../assets/js/ui.js?v=2"></script>
<script src="../assets/js/layout.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
  function buatChart(el, cfg) {
    try { if (window.Chart) return new Chart(el, cfg); } catch (e) { console.warn('Grafik gagal dimuat:', e); }
  }

  var session = Store.getSession();
  if (session && session.role === 'admin') {
    var univs = Store.getUniversitas();
    var mhs = Store.getMahasiswa();
    var ins = Store.getInstruktur();
    var pendaftaran = Store.getPendaftaran();

    var rekap = univs.map(function(u){
      var mhsUniv = mhs.filter(function(m){ return m.universitasId === u.id; });
      var mhsIds = mhsUniv.map(function(m){ return m.id; });
      var pdUniv = pendaftaran.filter(function(p){ return mhsIds.indexOf(p.mahasiswaId) !== -1; });
      var lulus = pdUniv.filter(function(p){ return p.status === 'lulus'; });
      return {
        organisasi: u,
        peserta: mhsUniv.length,
        trainer: ins.filter(function(i){ return i.universitasId === u.id; }).length,
        pendaftaran: pdUniv.length,
        lulus: lulus.length,
        tingkat: pdUniv.length ? Math.round((lulus.length / pdUniv.length) * 100) : 0
      };
    });

    document.getElementById('tbody').innerHTML = rekap.map(function(r){
      return '<tr>' +
        '<td class="font-semibold">' + r.organisasi.nama + '<br><span class="text-xs text-slate-400 font-normal">' + r.organisasi.kota + ' · Akreditasi ' + r.organisasi.akreditasi + '</span></td>' +
        '<td>' + r.peserta + '</td>' +
        '<td>' + r.trainer + '</td>' +
        '<td>' + r.pendaftaran + '</td>' +
        '<td>' + r.lulus + '</td>' +
        '<td><div class="flex items-center gap-2"><div class="progress-track w-24"><div class="progress-fill" style="width:' + r.tingkat + '%"></div></div><span class="text-xs font-bold text-slate-500">' + r.tingkat + '%</span></div></td>' +
      '</tr>';
    }).join('');

    buatChart(document.getElementById('chart-user'), {
      type: 'bar',
      data: {
        labels: rekap.map(function(r){ return r.organisasi.singkatan; }),
        datasets: [
          { label: 'Peserta', data: rekap.map(function(r){ return r.peserta; }), backgroundColor: '#1a5c97', borderRadius: 6 },
          { label: 'Trainer', data: rekap.map(function(r){ return r.trainer; }), backgroundColor: '#14b8a6', borderRadius: 6 }
        ]
      },
      options: { plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });

    document.getElementById('btn-csv').addEventListener('click', function(){
      var rows = [['Organisasi','Kota','Peserta','Trainer','Pendaftaran Sertifikasi','Lulus','Tingkat Kelulusan (%)']];
      rekap.forEach(function(r){ rows.push([r.organisasi.nama, r.organisasi.kota, r.peserta, r.trainer, r.pendaftaran, r.lulus, r.tingkat]); });
      var csv = rows.map(function(row){ return row.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'laporan-pengguna-per-organisasi.csv';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    });
  }
</script>
</body>
</html>
