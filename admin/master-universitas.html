<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Universitas — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="admin" data-active="master-universitas" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div><h1 class="text-xl font-extrabold text-slate-800">Master Universitas</h1><p class="text-sm text-slate-400 mt-0.5">Kelola daftar universitas mitra STU LMS.</p></div>
      <button id="btn-tambah" class="text-sm font-bold text-white px-4 py-2.5 rounded-lg flex items-center gap-1.5" style="background:var(--brand-800)">+ Tambah Universitas</button>
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full table-clean min-w-[640px]">
        <thead><tr><th>Universitas</th><th>Singkatan</th><th>Kota</th><th>Akreditasi</th><th>Mahasiswa</th><th>Aksi</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<div id="modal" class="fixed inset-0 z-[70] hidden items-center justify-center p-4 bg-slate-900/50">
  <div class="bg-white rounded-2xl w-full max-w-md p-6">
    <div class="flex items-center justify-between mb-4"><h3 class="font-bold text-slate-800">Tambah Universitas</h3><button id="modal-close" class="text-slate-400"></button></div>
    <form id="form" class="space-y-4">
      <div><label class="text-xs font-bold text-slate-500 mb-1 block">Nama Universitas</label><input id="f-nama" required class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs font-bold text-slate-500 mb-1 block">Singkatan</label><input id="f-singkatan" required maxlength="8" class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm uppercase"></div>
        <div><label class="text-xs font-bold text-slate-500 mb-1 block">Akreditasi</label><select id="f-akreditasi" class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm"><option>A</option><option>B</option><option>C</option></select></div>
      </div>
      <div><label class="text-xs font-bold text-slate-500 mb-1 block">Kota</label><input id="f-kota" required class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm"></div>
      <button type="submit" class="w-full font-bold text-white py-2.5 rounded-lg" style="background:var(--brand-800)">Simpan Universitas</button>
    </form>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  var session = Store.getSession();
  if (session && session.role === 'admin') {

    function render() {
      var list = Store.getUniversitas();
      document.getElementById('tbody').innerHTML = list.map(function(u){
        var jumlah = Store.getMahasiswa().filter(function(m){ return m.universitasId === u.id; }).length;
        return '<tr>' +
          '<td class="font-semibold">' + u.nama + '</td>' +
          '<td><span class="badge badge-biru">' + u.singkatan + '</span></td>' +
          '<td>' + u.kota + '</td>' +
          '<td>' + u.akreditasi + '</td>' +
          '<td>' + jumlah + '</td>' +
          '<td><button data-id="' + u.id + '" class="btn-hapus text-xs font-bold text-rose-600 hover:underline">Hapus</button></td>' +
        '</tr>';
      }).join('');

      document.querySelectorAll('.btn-hapus').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (!confirm('Hapus universitas ini dari daftar mitra?')) return;
          Store.hapus(btn.dataset.id);
          UI.toast('Universitas dihapus', 'peringatan');
          render();
        });
      });
    }

    function toggleModal(show) {
      document.getElementById('modal').classList.toggle('hidden', !show);
      document.getElementById('modal').classList.toggle('flex', show);
    }
    document.getElementById('modal-close').innerHTML = UI.Icon.x;
    document.getElementById('btn-tambah').addEventListener('click', function(){ toggleModal(true); });
    document.getElementById('modal-close').addEventListener('click', function(){ toggleModal(false); });

    document.getElementById('form').addEventListener('submit', function(e){
      e.preventDefault();
      Store.tambahUniversitas({
        nama: document.getElementById('f-nama').value,
        singkatan: document.getElementById('f-singkatan').value.toUpperCase(),
        kota: document.getElementById('f-kota').value,
        akreditasi: document.getElementById('f-akreditasi').value
      });
      document.getElementById('form').reset();
      toggleModal(false);
      UI.toast('Universitas berhasil ditambahkan', 'sukses');
      render();
    });

    render();
  }
</script>
</body>
</html>
