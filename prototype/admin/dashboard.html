<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css?v=5">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="admin" data-active="dashboard" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8" id="konten"></div>
</main>

<script src="../assets/js/data.js?v=5"></script>
<script src="../assets/js/store.js?v=5"></script>
<script src="../assets/js/ui.js?v=5"></script>
<script src="../assets/js/layout.js?v=5"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
  function buatChart(el, cfg) {
    try { if (window.Chart) return new Chart(el, cfg); } catch (e) { console.warn('Grafik gagal dimuat:', e); }
  }

  var session = Store.getSession();
  if (session && session.role === 'admin') {
    var univs = Store.getUniversitas();
    var pelatihan = Store.getSkema();
    var mhs = Store.getMahasiswa();
    var pendaftaran = Store.getPendaftaran();
    var sertifikat = Store.getSertifikat();
    var lulus = pendaftaran.filter(function(p){ return p.status === 'lulus'; });
    var menunggu = pendaftaran.filter(function(p){ return p.status === 'menunggu_approval'; });
    var tingkatLulus = pendaftaran.length ? Math.round((lulus.length / pendaftaran.length) * 100) : 0;

    var transaksi = Store.getTransaksi();
    var pendapatan = transaksi.filter(function(t){ return t.status === 'lunas'; }).reduce(function(sum,t){ return sum + t.jumlah; }, 0);

    var stat = [
      { n: univs.length, l: 'Organisasi Mitra', icon: 'building', bg: 'bg-indigo-50 text-indigo-700' },
      { n: mhs.length, l: 'Peserta Terdaftar', icon: 'users', bg: 'bg-blue-50 text-blue-700' },
      { n: sertifikat.length, l: 'Sertifikat Terbit', icon: 'shield', bg: 'bg-emerald-50 text-emerald-700' },
      { n: menunggu.length, l: 'Menunggu Approval', icon: 'clock', bg: 'bg-amber-50 text-amber-700' },
      { n: UI.formatRupiah(pendapatan), l: 'Pendapatan (Lunas)', icon: 'creditCard', bg: 'bg-teal-50 text-teal-700' },
      { n: tingkatLulus + '%', l: 'Tingkat Kelulusan', icon: 'chart', bg: 'bg-rose-50 text-rose-700' }
    ];

    document.getElementById('konten').innerHTML =
      '<div class="flex flex-wrap items-center justify-between gap-3 mb-6"><div><h1 class="text-xl font-extrabold text-slate-800">Dashboard Admin</h1><p class="text-sm text-slate-400 mt-0.5">Ringkasan lintas organisasi mitra STU LMS.</p></div>' +
        '<a href="approval-sertifikat.html" class="text-sm font-bold text-white px-4 py-2.5 rounded-lg" style="background:var(--brand-800)">Kelola Approval Sertifikat</a></div>' +

      '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">' +
        stat.map(function(s){ return '<div class="card p-5 stat-card"><div class="w-10 h-10 rounded-lg flex items-center justify-center mb-3 ' + s.bg + '">' + UI.Icon[s.icon] + '</div><p class="text-2xl font-extrabold text-slate-800">' + s.n + '</p><p class="text-xs text-slate-400 mt-0.5">' + s.l + '</p></div>'; }).join('') +
      '</div>' +

      '<div class="grid lg:grid-cols-3 gap-5 mb-8">' +
        '<div class="card p-5 lg:col-span-2"><p class="font-bold text-slate-800 mb-4">Sertifikat Terbit per Bulan</p><div class="h-64"><canvas id="chart-bulan"></canvas></div></div>' +
        '<div class="card p-5"><p class="font-bold text-slate-800 mb-4">Kategori Sertifikasi</p><div class="h-64"><canvas id="chart-kategori"></canvas></div></div>' +
      '</div>' +

      '<div class="grid lg:grid-cols-2 gap-5">' +
        '<div class="card p-5"><p class="font-bold text-slate-800 mb-4">Peserta per Organisasi</p><div class="h-64"><canvas id="chart-univ"></canvas></div></div>' +
        '<div class="card p-5">' +
          '<div class="flex items-center justify-between mb-4"><p class="font-bold text-slate-800">Menunggu Approval Sertifikat</p><a href="approval-sertifikat.html" class="text-xs font-bold text-brand-700">Lihat semua</a></div>' +
          '<div class="space-y-3">' + (menunggu.length ? menunggu.slice(0,5).map(function(p){
            var m = Store.mahasiswaById(p.mahasiswaId), s = Store.skemaById(p.skemaId);
            return '<div class="flex items-center gap-2.5"><span class="avatar w-8 h-8 text-[11px]">' + UI.inisial(m.nama) + '</span><div class="flex-1 min-w-0"><p class="text-sm font-semibold text-slate-700 truncate">' + m.nama + '</p><p class="text-xs text-slate-400 truncate">' + s.nama + '</p></div><span class="text-xs font-bold text-emerald-600">' + p.skorKuis + '</span></div>';
          }).join('') : '<p class="text-sm text-slate-400">Tidak ada pengajuan menunggu saat ini.</p>') + '</div>' +
        '</div>' +
      '</div>';

    // Chart: sertifikat per bulan
    var bulanMap = {};
    sertifikat.forEach(function(c){
      var key = c.tanggalTerbit.slice(0,7);
      bulanMap[key] = (bulanMap[key] || 0) + 1;
    });
    var bulanKeys = Object.keys(bulanMap).sort();
    var BULAN_SINGKAT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    var bulanLabel = bulanKeys.map(function(k){ var p = k.split('-'); return BULAN_SINGKAT[parseInt(p[1],10)-1] + ' ' + p[0]; });

    buatChart(document.getElementById('chart-bulan'), {
      type: 'bar',
      data: { labels: bulanLabel, datasets: [{ label: 'Sertifikat Terbit', data: bulanKeys.map(function(k){ return bulanMap[k]; }), backgroundColor: '#1a5c97', borderRadius: 6, maxBarThickness: 34 }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });

    var kategoriCount = { internasional: 0, bnsp: 0 };
    pendaftaran.forEach(function(p){ var s = Store.skemaById(p.skemaId); if (s) kategoriCount[s.kategori]++; });
    buatChart(document.getElementById('chart-kategori'), {
      type: 'doughnut',
      data: { labels: ['Internasional', 'BNSP'], datasets: [{ data: [kategoriCount.internasional, kategoriCount.bnsp], backgroundColor: ['#1a5c97', '#14b8a6'] }] },
      options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } } }
    });

    var univCount = univs.map(function(u){ return mhs.filter(function(m){ return m.universitasId === u.id; }).length; });
    buatChart(document.getElementById('chart-univ'), {
      type: 'bar',
      data: { labels: univs.map(function(u){ return u.singkatan; }), datasets: [{ label: 'Peserta', data: univCount, backgroundColor: '#14b8a6', borderRadius: 6, maxBarThickness: 34 }] },
      options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }
    });
  }
</script>
</body>
</html>
