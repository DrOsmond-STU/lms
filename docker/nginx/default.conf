# STU LMS — Nginx (docs/11 §8, keamanan/13). TLS diterminasi di edge (CDN/LB).
server_tokens off;

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 21m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    # Berkas tersembunyi & sensitif tidak pernah disajikan (SEC-INFRA-14).
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(env|log|sql|bak|ini|sh|lock|yml|yaml|neon|md)$ { return 404; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hanya front controller yang dieksekusi.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }
}
