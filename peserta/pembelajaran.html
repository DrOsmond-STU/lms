<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembelajaran Saya — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css?v=4">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="peserta" data-active="pembelajaran" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="mb-6">
      <h1 class="text-xl font-extrabold text-slate-800">Pembelajaran Saya</h1>
      <p class="text-sm text-slate-400 mt-0.5">Kelas dari pelatihan yang sedang &amp; telah Anda ikuti.</p>
    </div>

    <div class="flex flex-wrap bg-slate-100 rounded-lg p-1 mb-6 gap-1 w-fit" id="filter-status"></div>

    <div id="grid-kelas" class="grid sm:grid-cols-2 gap-5"></div>
  </div>
</main>

<script src="../assets/js/data.js?v=4"></script>
<script src="../assets/js/store.js?v=4"></script>
<script src="../assets/js/ui.js?v=4"></script>
<script src="../assets/js/layout.js?v=4"></script>
<script>
  var session = Store.getSession();
  if (session && session.role === 'peserta') {
    var mhsId = session.userId;
    var FILTERS = [
      { k: 'semua', l: 'Semua' },
      { k: 'berjalan', l: 'Berjalan' },
      { k: 'terdaftar', l: 'Terdaftar' },
      { k: 'menunggu_approval', l: 'Menunggu Approval' },
      { k: 'lulus', l: 'Lulus' },
      { k: 'tidak_lulus', l: 'Belum Lulus' }
    ];
    var aktif = 'semua';

    function paintFilter() {
      document.getElementById('filter-status').innerHTML = FILTERS.map(function(f){
        var on = f.k === aktif;
        return '<button data-k="' + f.k + '" class="ft-btn text-xs font-bold px-3.5 py-2 rounded-lg transition ' + (on ? 'bg-white shadow text-brand-800' : 'text-slate-500') + '">' + f.l + '</button>';
      }).join('');
    }

    function render() {
      var semua = Store.pendaftaranMahasiswa(mhsId);
      var list = aktif === 'semua' ? semua : semua.filter(function(p){ return p.status === aktif; });
      document.getElementById('grid-kelas').innerHTML = list.length ? list.map(function(p){
        var pelatihan = Store.skemaById(p.skemaId);
        var kelas = Store.kelasBySkemaId(p.skemaId);
        var totalModul = kelas.modul.length;
        return '<a href="kelas-detail.html?id=' + kelas.id + '" class="card p-5 flex flex-col hover:shadow-md transition">' +
          '<div class="flex items-center justify-between mb-3">' + UI.kategoriTag(pelatihan.kategori) + UI.badgePendaftaran(p.status) + '</div>' +
          '<h3 class="font-bold text-slate-800 leading-snug mb-1">' + pelatihan.nama + '</h3>' +
          '<p class="text-xs text-slate-400 mb-4">' + pelatihan.penyelenggara + ' · Batch ' + kelas.batch + '</p>' +
          '<div class="progress-track mb-1.5"><div class="progress-fill" style="width:' + p.progres + '%"></div></div>' +
          '<div class="flex items-center justify-between text-xs text-slate-400 mb-4"><span>' + p.progres + '% selesai</span><span>' + p.modulSelesai.length + '/' + totalModul + ' modul</span></div>' +
          '<span class="text-xs font-bold text-brand-700 flex items-center gap-1 mt-auto">' + (p.status === 'lulus' ? 'Lihat Ringkasan' : 'Lanjutkan Belajar') + ' ' + UI.Icon.arrowRight + '</span>' +
        '</a>';
      }).join('') : '<div class="col-span-full card p-10 text-center text-slate-400 text-sm">Belum ada pembelajaran pada kategori ini. <a href="sertifikasi.html" class="text-brand-700 font-bold">Pilih sertifikasi</a> untuk memulai.</div>';
    }

    document.getElementById('filter-status').addEventListener('click', function(e){
      var btn = e.target.closest('.ft-btn');
      if (!btn) return;
      aktif = btn.dataset.k;
      paintFilter();
      render();
    });

    paintFilter();
    render();
  }
</script>
</body>
</html>
