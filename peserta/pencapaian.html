<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pencapaian — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css?v=4">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="peserta" data-active="pencapaian" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
    <div class="mb-6"><h1 class="text-xl font-extrabold text-slate-800">Pencapaian</h1><p class="text-sm text-slate-400 mt-0.5">Poin, lencana, dan peringkat Anda di STU LMS.</p></div>

    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-6">
        <div class="card p-6 certificate-frame text-white">
          <p class="text-xs text-white/70 mb-1">Total Poin Anda</p>
          <p id="poin-saya" class="text-4xl font-extrabold"></p>
          <p id="peringkat-saya" class="text-xs text-white/70 mt-2"></p>
        </div>

        <div>
          <p class="font-bold text-slate-800 mb-4">Lencana</p>
          <div id="grid-lencana" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
        </div>
      </div>

      <div>
        <p class="font-bold text-slate-800 mb-4">Papan Peringkat</p>
        <div class="card p-2" id="leaderboard"></div>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/data.js?v=4"></script>
<script src="../assets/js/store.js?v=4"></script>
<script src="../assets/js/ui.js?v=4"></script>
<script src="../assets/js/layout.js?v=4"></script>
<script>
  var session = Store.getSession();
  if (session && session.role === 'peserta') {
    var mhsId = session.userId;
    var pencapaian = Store.pencapaianPeserta(mhsId);
    var leaderboard = Store.getLeaderboard();
    var peringkat = leaderboard.findIndex(function(p){ return p.mahasiswaId === mhsId; }) + 1;

    document.getElementById('poin-saya').textContent = pencapaian.poin + ' poin';
    document.getElementById('peringkat-saya').textContent = peringkat ? 'Peringkat #' + peringkat + ' dari ' + leaderboard.length + ' peserta aktif' : 'Belum masuk papan peringkat';

    document.getElementById('grid-lencana').innerHTML = Store.getLencana().map(function(b){
      var didapat = pencapaian.lencanaIds.indexOf(b.id) !== -1;
      return '<div class="card p-4 text-center ' + (didapat ? '' : 'opacity-40 grayscale') + '">' +
        '<div class="text-3xl mb-2">' + b.ikon + '</div>' +
        '<p class="text-xs font-bold text-slate-700 leading-snug">' + b.nama + '</p>' +
        '<p class="text-[11px] text-slate-400 mt-1">' + b.deskripsi + '</p>' +
        (didapat ? '<span class="inline-block mt-2 text-[10px] font-bold text-emerald-600">DIRAIH</span>' : '<span class="inline-block mt-2 text-[10px] font-bold text-slate-400">BELUM DIRAIH</span>') +
      '</div>';
    }).join('');

    document.getElementById('leaderboard').innerHTML = leaderboard.slice(0, 10).map(function(p, idx){
      var isMe = p.mahasiswaId === mhsId;
      return '<div class="flex items-center gap-3 p-2.5 rounded-lg ' + (isMe ? 'bg-brand-50' : '') + '">' +
        '<span class="w-6 text-center text-xs font-extrabold ' + (idx < 3 ? 'text-amber-500' : 'text-slate-400') + '">' + (idx + 1) + '</span>' +
        '<span class="avatar w-8 h-8 text-[11px]">' + UI.inisial(p.peserta.nama) + '</span>' +
        '<span class="flex-1 min-w-0 text-sm font-semibold text-slate-700 truncate">' + p.peserta.nama + (isMe ? ' (Anda)' : '') + '</span>' +
        '<span class="text-xs font-bold text-slate-500">' + p.poin + ' pts</span>' +
      '</div>';
    }).join('');
  }
</script>
</body>
</html>
