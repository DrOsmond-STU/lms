<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifikasi — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css?v=4">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="peserta" data-active="notifikasi" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div><h1 class="text-xl font-extrabold text-slate-800">Notifikasi</h1><p class="text-sm text-slate-400 mt-0.5">Semua pemberitahuan aktivitas akun Anda.</p></div>
      <button id="btn-baca-semua" class="text-xs font-bold text-brand-700 hover:underline">Tandai semua telah dibaca</button>
    </div>
    <div id="daftar-notif" class="space-y-2"></div>
  </div>
</main>

<script src="../assets/js/data.js?v=4"></script>
<script src="../assets/js/store.js?v=4"></script>
<script src="../assets/js/ui.js?v=4"></script>
<script src="../assets/js/layout.js?v=4"></script>
<script>
  var session = Store.getSession();
  if (session && session.role === 'peserta') {
    var mhsId = session.userId;
    var ICON_BY_KATEGORI = {
      registrasi: 'user', enrollment: 'cert', sertifikat: 'shield', jadwal: 'calendar',
      reminder_tugas: 'clipboard', reminder_ujian: 'clock', pencapaian: 'trophy', live_class: 'video'
    };

    function render() {
      var list = Store.getNotifikasiPeserta(mhsId).slice().reverse();
      document.getElementById('daftar-notif').innerHTML = list.length ? list.map(function(n){
        return '<div class="card p-4 flex items-start gap-3 ' + (n.dibaca ? '' : 'border-brand-200 bg-brand-50/30') + '">' +
          '<div class="w-9 h-9 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center flex-shrink-0">' + (UI.Icon[ICON_BY_KATEGORI[n.kategori]] || UI.Icon.bell2) + '</div>' +
          '<div class="flex-1 min-w-0">' +
            '<div class="flex items-center gap-2"><p class="text-sm font-bold text-slate-800">' + n.judul + '</p>' + (n.dibaca ? '' : '<span class="w-1.5 h-1.5 rounded-full bg-brand-500"></span>') + '</div>' +
            '<p class="text-xs text-slate-500 mt-0.5">' + n.isi + '</p>' +
            '<p class="text-[11px] text-slate-400 mt-1.5">' + n.waktu + '</p>' +
          '</div>' +
          (n.dibaca ? '' : '<button data-id="' + n.id + '" class="btn-baca text-[11px] font-bold text-brand-700 flex-shrink-0">Tandai dibaca</button>') +
        '</div>';
      }).join('') : '<div class="card p-10 text-center text-slate-400 text-sm">Belum ada notifikasi.</div>';
    }

    document.getElementById('daftar-notif').addEventListener('click', function(e){
      var btn = e.target.closest('.btn-baca');
      if (!btn) return;
      Store.tandaiNotifBaca(btn.dataset.id);
      render();
    });
    document.getElementById('btn-baca-semua').addEventListener('click', function(){
      Store.tandaiSemuaNotifBaca(mhsId);
      render();
    });

    render();
  }
</script>
</body>
</html>
