<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Sertifikasi — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css?v=3">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="peserta" data-active="sertifikasi" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8" id="konten"></div>
</main>

<script src="../assets/js/data.js?v=3"></script>
<script src="../assets/js/store.js?v=3"></script>
<script src="../assets/js/ui.js?v=3"></script>
<script src="../assets/js/layout.js?v=3"></script>
<script>
  var session = Store.getSession();
  if (session && session.role === 'peserta') {
    var mhsId = session.userId;
    var skemaId = UI.qs('id');
    var s = Store.skemaById(skemaId);
    var el = document.getElementById('konten');

    if (!s) {
      el.innerHTML = '<div class="card p-10 text-center text-slate-400">Pelatihan sertifikasi tidak ditemukan. <a href="sertifikasi.html" class="text-brand-700 font-bold">Kembali ke katalog</a></div>';
    } else {
      var kelas = Store.kelasBySkemaId(s.id);
      var trainer = kelas ? Store.instrukturById(kelas.instrukturId) : null;
      var pendaftaran = Store.pendaftaranSkema(mhsId, s.id);

      function aksiBox() {
        if (!pendaftaran) {
          return '<button id="btn-daftar" class="w-full font-bold text-white py-3 rounded-xl" style="background:var(--brand-800)">Daftar Sertifikasi Ini</button>' +
            '<p class="text-[11px] text-slate-400 text-center mt-2">Gratis · Ditanggung kampus Anda</p>';
        }
        if (pendaftaran.status === 'lulus') {
          return '<a href="sertifikat-saya.html" class="block w-full text-center font-bold text-white py-3 rounded-xl" style="background:#0e9488">Lihat Sertifikat Saya</a>';
        }
        return '<a href="kelas-detail.html?id=' + kelas.id + '" class="block w-full text-center font-bold text-white py-3 rounded-xl" style="background:var(--brand-800)">Lanjutkan Pembelajaran</a>' +
          '<p class="text-[11px] text-slate-400 text-center mt-2">Status: ' + UI.labelStatusPendaftaran(pendaftaran.status) + ' · Progres ' + pendaftaran.progres + '%</p>';
      }

      el.innerHTML =
        '<a href="sertifikasi.html" class="text-xs font-bold text-slate-400 hover:text-brand-700 flex items-center gap-1 mb-5">&larr; Kembali ke katalog</a>' +
        '<div class="grid lg:grid-cols-3 gap-6">' +
          '<div class="lg:col-span-2">' +
            '<div class="card p-6 mb-5">' +
              '<div class="flex items-center justify-between mb-3">' + UI.kategoriTag(s.kategori) + '<span class="text-[11px] font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">GRATIS</span></div>' +
              '<h1 class="text-xl md:text-2xl font-extrabold text-slate-800 mb-2">' + s.nama + '</h1>' +
              '<p class="text-sm text-slate-500 mb-4">Diselenggarakan oleh <span class="font-semibold text-slate-700">' + s.penyelenggara + '</span> · Kode Pelatihan <span class="font-mono">' + s.kodeSkema + '</span></p>' +
              '<p class="text-sm text-slate-600 leading-relaxed mb-5">' + s.deskripsi + '</p>' +
              '<div class="flex flex-wrap gap-2">' + s.tags.map(function(t){ return '<span class="text-[11px] font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">' + t + '</span>'; }).join('') + '</div>' +
            '</div>' +

            (kelas ? '<div class="card p-6">' +
              '<h2 class="font-bold text-slate-800 mb-4">Silabus Pembelajaran</h2>' +
              '<div class="space-y-2.5">' + kelas.modul.map(function(m, idx){
                var iconTipe = m.tipe === 'video' ? 'play' : m.tipe === 'quiz' ? 'check' : 'doc';
                return '<div class="modul-item"><span class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center text-xs font-bold">' + (idx+1) + '</span>' +
                  '<span class="text-slate-400">' + UI.Icon[iconTipe] + '</span>' +
                  '<div class="flex-1"><p class="text-sm font-semibold text-slate-700">' + m.judul + '</p><p class="text-xs text-slate-400">' + m.durasi + '</p></div></div>';
              }).join('') + '</div>' +
            '</div>' : '') +
          '</div>' +

          '<div>' +
            '<div class="card p-5 mb-5" id="aksi-box">' + aksiBox() + '</div>' +
            '<div class="card p-5 space-y-3.5 text-sm">' +
              '<div class="flex items-center justify-between"><span class="text-slate-400">Kategori</span><span class="font-semibold text-slate-700">' + (s.kategori === 'internasional' ? 'Internasional' : 'BNSP') + '</span></div>' +
              '<div class="flex items-center justify-between"><span class="text-slate-400">Level</span><span class="font-semibold text-slate-700">' + s.level + '</span></div>' +
              '<div class="flex items-center justify-between"><span class="text-slate-400">Durasi</span><span class="font-semibold text-slate-700">' + s.durasiJam + ' jam</span></div>' +
              '<div class="flex items-center justify-between"><span class="text-slate-400">Jumlah Modul</span><span class="font-semibold text-slate-700">' + (kelas ? kelas.modul.length : '-') + '</span></div>' +
              '<div class="flex items-center justify-between"><span class="text-slate-400">Skor Kelulusan</span><span class="font-semibold text-slate-700">Min. ' + s.skorMinimal + '</span></div>' +
              (kelas && trainer ? '<div class="pt-3 border-t border-slate-100"><p class="text-xs text-slate-400 mb-2">Trainer Pengampu</p><div class="flex items-center gap-2.5"><span class="avatar w-9 h-9 text-xs">' + UI.inisial(trainer.nama) + '</span><div><p class="font-semibold text-slate-700 text-sm leading-tight">' + trainer.nama + '</p><p class="text-xs text-slate-400">' + trainer.keahlian + '</p></div></div></div>' : '') +
            '</div>' +
          '</div>' +
        '</div>';

      var btnDaftar = document.getElementById('btn-daftar');
      if (btnDaftar) {
        btnDaftar.addEventListener('click', function(){
          Store.daftarSertifikasi(mhsId, s.id);
          UI.toast('Berhasil mendaftar sertifikasi!', 'sukses');
          pendaftaran = Store.pendaftaranSkema(mhsId, s.id);
          document.getElementById('aksi-box').innerHTML = aksiBox();
        });
      }
    }
  }
</script>
</body>
</html>
