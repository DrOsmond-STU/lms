<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Peserta — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="peserta" data-active="dashboard" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8" id="konten"></div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/certificate.js"></script>
<script>
  var session = Store.getSession();
  if (session && session.role === 'peserta') {
    var mhs = Store.mahasiswaById(session.userId);
    var univ = Store.universitasById(mhs.universitasId);
    var pendaftaran = Store.pendaftaranMahasiswa(mhs.id);
    var sertifikat = Store.sertifikatMahasiswa(mhs.id);

    var berjalan = pendaftaran.filter(function(p){ return p.status === 'berjalan' || p.status === 'terdaftar'; });
    var lulus = pendaftaran.filter(function(p){ return p.status === 'lulus'; });
    var menunggu = pendaftaran.filter(function(p){ return p.status === 'menunggu_approval'; });
    var sertifikatAktif = sertifikat.filter(function(c){ return Certificate ? Certificate.statusEfektif(c) === 'aktif' : c.status === 'aktif'; });

    var stat = [
      { n: pendaftaran.length, l: 'Sertifikasi Diikuti', icon: 'cert', bg: 'bg-brand-50 text-brand-700' },
      { n: berjalan.length, l: 'Sedang Berjalan', icon: 'clock', bg: 'bg-blue-50 text-blue-700' },
      { n: menunggu.length, l: 'Menunggu Approval', icon: 'check', bg: 'bg-amber-50 text-amber-700' },
      { n: sertifikat.length, l: 'Sertifikat Diterbitkan', icon: 'shield', bg: 'bg-emerald-50 text-emerald-700' }
    ];

    function kartuPembelajaran(p) {
      var pelatihan = Store.skemaById(p.skemaId);
      var kelas = Store.kelasBySkemaId(p.skemaId);
      return '<a href="kelas-detail.html?id=' + kelas.id + '" class="card p-5 block hover:shadow-md transition">' +
        '<div class="flex items-center justify-between mb-3">' + UI.kategoriTag(pelatihan.kategori) + UI.badgePendaftaran(p.status) + '</div>' +
        '<h3 class="font-bold text-slate-800 text-sm leading-snug mb-3">' + pelatihan.nama + '</h3>' +
        '<div class="progress-track mb-1.5"><div class="progress-fill" style="width:' + p.progres + '%"></div></div>' +
        '<p class="text-xs text-slate-400">' + p.progres + '% selesai</p>' +
      '</a>';
    }

    function kartuSertifikat(c) {
      var pelatihan = Store.skemaById(c.skemaId);
      return '<div class="card p-5">' +
        '<div class="flex items-center justify-between mb-3">' + UI.kategoriTag(pelatihan.kategori) + UI.badgeSertifikat(c.status) + '</div>' +
        '<h3 class="font-bold text-slate-800 text-sm leading-snug mb-2">' + pelatihan.nama + '</h3>' +
        '<p class="text-xs text-slate-400 font-mono mb-4">' + c.nomor + '</p>' +
        '<a href="sertifikat-saya.html" class="text-xs font-bold text-brand-700 flex items-center gap-1">Lihat Sertifikat ' + UI.Icon.arrowRight + '</a>' +
      '</div>';
    }

    var rekomendasi = Store.getSkema().filter(function(s){
      return !pendaftaran.some(function(p){ return p.skemaId === s.id; });
    }).slice(0, 3);

    document.getElementById('konten').innerHTML =
      '<div class="flex flex-wrap items-center justify-between gap-3 mb-6">' +
        '<div><h1 class="text-xl font-extrabold text-slate-800">Halo, ' + mhs.nama.split(' ')[0] + ' 👋</h1><p class="text-sm text-slate-400 mt-0.5">' + univ.nama + ' · ' + mhs.prodi + '</p></div>' +
        '<a href="sertifikasi.html" class="text-sm font-bold text-white px-4 py-2.5 rounded-lg flex items-center gap-1.5" style="background:var(--brand-800)">' + UI.Icon.plus + ' Pilih Sertifikasi Baru</a>' +
      '</div>' +

      '<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">' +
        stat.map(function(s){
          return '<div class="card p-5 stat-card"><div class="w-10 h-10 rounded-lg flex items-center justify-center mb-3 ' + s.bg + '">' + UI.Icon[s.icon] + '</div><p class="text-2xl font-extrabold text-slate-800">' + s.n + '</p><p class="text-xs text-slate-400 mt-0.5">' + s.l + '</p></div>';
        }).join('') +
      '</div>' +

      '<div class="flex items-center justify-between mb-4"><h2 class="font-bold text-slate-800">Pembelajaran Berjalan</h2><a href="pembelajaran.html" class="text-xs font-bold text-brand-700">Lihat semua</a></div>' +
      (berjalan.length
        ? '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-10">' + berjalan.map(kartuPembelajaran).join('') + '</div>'
        : '<div class="card p-8 text-center text-slate-400 text-sm mb-10">Belum ada pembelajaran yang sedang berjalan. <a href="sertifikasi.html" class="text-brand-700 font-bold">Pilih sertifikasi</a> untuk mulai belajar.</div>') +

      '<div class="flex items-center justify-between mb-4"><h2 class="font-bold text-slate-800">Sertifikat Saya</h2><a href="sertifikat-saya.html" class="text-xs font-bold text-brand-700">Lihat semua</a></div>' +
      (sertifikat.length
        ? '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-10">' + sertifikat.map(kartuSertifikat).join('') + '</div>'
        : '<div class="card p-8 text-center text-slate-400 text-sm mb-10">Anda belum memiliki sertifikat. Selesaikan pembelajaran &amp; lulus kuis untuk mendapatkan sertifikat pertama Anda.</div>') +

      (rekomendasi.length ? (
        '<div class="flex items-center justify-between mb-4"><h2 class="font-bold text-slate-800">Rekomendasi Sertifikasi</h2><a href="sertifikasi.html" class="text-xs font-bold text-brand-700">Lihat katalog</a></div>' +
        '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">' + rekomendasi.map(function(s){
          return '<a href="sertifikasi-detail.html?id=' + s.id + '" class="card p-5 block hover:shadow-md transition">' +
            '<div class="mb-3">' + UI.kategoriTag(s.kategori) + '</div>' +
            '<h3 class="font-bold text-slate-800 text-sm leading-snug mb-2">' + s.nama + '</h3>' +
            '<p class="text-xs text-slate-400 mb-3">' + s.penyelenggara + '</p>' +
            '<span class="text-xs font-bold text-brand-700 flex items-center gap-1">Lihat Detail ' + UI.Icon.arrowRight + '</span>' +
          '</a>';
        }).join('') + '</div>'
      ) : '')
    ;
  }
</script>
</body>
</html>
