<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Trainer — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css?v=3">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="trainer" data-active="laporan" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div><h1 class="text-xl font-extrabold text-slate-800">Laporan</h1><p class="text-sm text-slate-400 mt-0.5">Ringkasan performa kelas yang Anda ampu.</p></div>
      <button id="btn-csv" class="text-sm font-bold border border-slate-200 px-4 py-2.5 rounded-lg hover:bg-slate-50">Unduh CSV</button>
    </div>
    <div class="card overflow-x-auto">
      <table class="w-full table-clean min-w-[820px]">
        <thead><tr><th>Kelas</th><th>Peserta</th><th>Completion Rate</th><th>Rata-rata Skor</th><th>Kehadiran Rata-rata</th><th>Lulus</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../assets/js/data.js?v=3"></script>
<script src="../assets/js/store.js?v=3"></script>
<script src="../assets/js/ui.js?v=3"></script>
<script src="../assets/js/layout.js?v=3"></script>
<script>
  var session = Store.getSession();
  if (session && session.role === 'trainer') {
    var ins = Store.instrukturById(session.userId);
    var kelasSaya = Store.getKelas().filter(function(k){ return k.instrukturId === ins.id; });

    var rekap = kelasSaya.map(function(k){
      var skema = Store.skemaById(k.skemaId);
      var peserta = Store.pendaftaranByKelas(k.skemaId);
      var selesai = peserta.filter(function(p){ return p.progres === 100; });
      var lulus = peserta.filter(function(p){ return p.status === 'lulus'; });
      var skorList = peserta.filter(function(p){ return p.skorKuis !== null; }).map(function(p){ return p.skorKuis; });
      var rataSkor = skorList.length ? Math.round(skorList.reduce(function(a,b){ return a+b; },0) / skorList.length) : null;
      var sesi = Store.sesiByKelas(k.id);
      var rataHadir = null;
      if (sesi.length && peserta.length) {
        var totalPersen = peserta.reduce(function(sum, p){ return sum + Store.rekapKehadiran(k.id, p.mahasiswaId).persen; }, 0);
        rataHadir = Math.round(totalPersen / peserta.length);
      }
      return { skema: skema, k: k, total: peserta.length, completion: peserta.length ? Math.round((selesai.length/peserta.length)*100) : 0, rataSkor: rataSkor, rataHadir: rataHadir, lulus: lulus.length };
    });

    document.getElementById('tbody').innerHTML = rekap.length ? rekap.map(function(r){
      return '<tr>' +
        '<td class="font-semibold">' + r.skema.nama + '<br><span class="text-xs text-slate-400 font-normal">Batch ' + r.k.batch + '</span></td>' +
        '<td>' + r.total + '</td>' +
        '<td><div class="flex items-center gap-2"><div class="progress-track w-20"><div class="progress-fill" style="width:' + r.completion + '%"></div></div><span class="text-xs font-bold text-slate-500">' + r.completion + '%</span></div></td>' +
        '<td>' + (r.rataSkor !== null ? r.rataSkor : '-') + '</td>' +
        '<td>' + (r.rataHadir !== null ? r.rataHadir + '%' : '-') + '</td>' +
        '<td>' + r.lulus + '</td>' +
      '</tr>';
    }).join('') : '<tr><td colspan="6" class="text-center text-slate-400 py-8">Belum ada kelas.</td></tr>';

    document.getElementById('btn-csv').addEventListener('click', function(){
      var rows = [['Kelas','Peserta','Completion Rate (%)','Rata-rata Skor','Kehadiran Rata-rata (%)','Lulus']];
      rekap.forEach(function(r){ rows.push([r.skema.nama, r.total, r.completion, r.rataSkor || '-', r.rataHadir !== null ? r.rataHadir : '-', r.lulus]); });
      var csv = rows.map(function(row){ return row.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'laporan-trainer.csv';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    });
  }
</script>
</body>
</html>
