<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelas Saya — STU LMS</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      brand: {50:'#eef5fb',100:'#d7e8f4',200:'#b0d1e9',300:'#83b6db',400:'#4f93c6',500:'#2f78ad',600:'#1a5c97',700:'#124a7d',800:'#0e3a63',900:'#0b2f52'},
      accent: {50:'#effcfa',100:'#c9f6ee',200:'#94ecdc',300:'#5fdfca',400:'#2ecdb3',500:'#14b8a6',600:'#0e9488',700:'#0c766e',800:'#0b5f59',900:'#0a4d49'}
    },
    fontFamily: { sans: ['"Plus Jakarta Sans"','ui-sans-serif','system-ui'] }
  } } }
</script>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800">

<div id="shell" data-role="trainer" data-active="kelas" data-base="../"></div>

<main class="lg:pl-64 pt-16 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="mb-6"><h1 class="text-xl font-extrabold text-slate-800">Kelas Saya</h1><p class="text-sm text-slate-400 mt-0.5">Kelola materi, kuis, dan pantau peserta di setiap kelas yang Anda ampu.</p></div>
    <div id="grid-kelas" class="grid sm:grid-cols-2 gap-5"></div>
  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  var session = Store.getSession();
  if (session && session.role === 'trainer') {
    var ins = Store.instrukturById(session.userId);
    var kelasSaya = Store.getKelas().filter(function(k){ return k.instrukturId === ins.id; });

    document.getElementById('grid-kelas').innerHTML = kelasSaya.length ? kelasSaya.map(function(k){
      var s = Store.skemaById(k.skemaId);
      var peserta = Store.pendaftaranByKelas(k.skemaId);
      var lulus = peserta.filter(function(p){ return p.status === 'lulus'; }).length;
      return '<div class="card p-5">' +
        '<div class="flex items-center justify-between mb-3">' + UI.kategoriTag(s.kategori) + '<span class="text-[11px] font-bold text-slate-400">Batch ' + k.batch + '</span></div>' +
        '<h3 class="font-bold text-slate-800 leading-snug mb-1">' + s.nama + '</h3>' +
        '<p class="text-xs text-slate-400 mb-4">' + s.penyelenggara + '</p>' +
        '<div class="grid grid-cols-3 gap-2 text-center mb-4">' +
          '<div class="bg-slate-50 rounded-lg py-2"><p class="font-extrabold text-slate-800 text-sm">' + k.modul.length + '</p><p class="text-[10px] text-slate-400">Modul</p></div>' +
          '<div class="bg-slate-50 rounded-lg py-2"><p class="font-extrabold text-slate-800 text-sm">' + peserta.length + '</p><p class="text-[10px] text-slate-400">Peserta</p></div>' +
          '<div class="bg-slate-50 rounded-lg py-2"><p class="font-extrabold text-slate-800 text-sm">' + lulus + '</p><p class="text-[10px] text-slate-400">Lulus</p></div>' +
        '</div>' +
        '<div class="flex items-center gap-2">' +
          '<a href="kelas-kelola.html?id=' + k.id + '" class="flex-1 text-center text-xs font-bold text-white rounded-lg py-2.5" style="background:var(--brand-800)">Kelola Konten</a>' +
          '<a href="peserta.html?kelas=' + k.id + '" class="flex-1 text-center text-xs font-bold border border-slate-200 rounded-lg py-2.5 hover:bg-slate-50">Lihat Peserta</a>' +
        '</div>' +
      '</div>';
    }).join('') : '<div class="col-span-full card p-10 text-center text-slate-400 text-sm">Anda belum mengampu kelas apa pun.</div>';
  }
</script>
</body>
</html>
