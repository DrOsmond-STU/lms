# CI STU LMS — gerbang kualitas & keamanan (docs/11 §4, keamanan/14 §2).
# Semua action dipin ke commit SHA; izin token minimal; tidak memakai pull_request_target.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, sodium
          coverage: none
          tools: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pint (gaya kode)
        run: vendor/bin/pint --test
      - name: Larastan (level 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  test:
    name: Tests (PostgreSQL + Redis nyata)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, sodium
          coverage: none
          tools: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Buat peran & basis data (stu_migrator / stu_app)
        env:
          PGPASSWORD: postgres_ci_only
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f docker/postgres/init-roles.sql
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Pest (unit, feature, security, arch)
        run: vendor/bin/pest --ci

  security:
    name: Security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: SCA — composer audit
        run: composer audit --no-interaction --locked
      - name: SCA — npm audit
        run: npm audit --audit-level=high
      - name: Secret scanning — gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: SAST — Semgrep
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src semgrep/semgrep:1.178.0
          semgrep scan --error --metrics=off
          --config p/php --config p/secrets --config .semgrep.yml
          --exclude prototype --exclude vendor --exclude node_modules
